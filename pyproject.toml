[project]
name = "jn-algorithm-fluxcast"
version = "0.2.2"
description = "Seven-station green-carbon coordinated dispatch service"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "numpy>=1.26,<3.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
    "scipy>=1.11,<1.16",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"src/dispatch_engine.py" = ["E501"]
# Preserve verified upstream bytes; integration code remains subject to all checks.
"src/vendor/dayahead/*.py" = ["I001", "E501", "B905", "F402"]
