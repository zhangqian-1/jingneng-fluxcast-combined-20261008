name: jingneng-forecast-dispatch

services:
  dispatch:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        POWER_FORECAST_IMAGE: ${POWER_FORECAST_IMAGE:?Set original single-step image}
        DAY_FORECAST_IMAGE: ${DAY_FORECAST_IMAGE:?Set original day-ahead image}
    image: ${DISPATCH_IMAGE:-jingneng-fluxcast-all-in-one:20261008-observations}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${DISPATCH_BIND:-127.0.0.1}:${DISPATCH_PORT:-18768}:8000"
    environment:
      FORECAST_BASE_URL: http://127.0.0.1:8001
      DAY_FORECAST_BASE_URL: http://127.0.0.1:8002
      SINGLE_PERIOD_DB_PATH: /app/runtime/single-period.sqlite3
      WORK_LOG_PATH: /app/runtime/logs/work.jsonl
      DISPATCH_DAY_TIMEZONE: Asia/Shanghai
    volumes:
      - single_step_forecast_runtime:/opt/forecast-single/runtime
      - day_ahead_forecast_runtime_20261008:/opt/forecast-day/runtime
      - single_step_dispatch_runtime:/app/runtime
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  single_step_forecast_runtime:
  single_step_dispatch_runtime:
  day_ahead_forecast_runtime_20261008:
